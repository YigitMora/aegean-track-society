name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE PRODUCTION followed by the exact 40-character main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact main commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      approved_sha: ${{ steps.authorize.outputs.approved_sha }}

    steps:
      - name: Verify trusted main dispatch and exact confirmation
        id: authorize
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = "MIGRATE PRODUCTION $GITHUB_SHA"
          echo "approved_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Record authorized operation
        shell: bash
        run: |
          {
            echo "### Authorized production database migration"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Apply Prisma migrations
    needs: authorize
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.approved_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pnpm prisma:deploy
