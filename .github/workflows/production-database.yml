name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE PRODUCTION followed by the exact 40-character main SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact main commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      approved_sha: ${{ steps.authorize.outputs.approved_sha }}

    steps:
      - name: Verify trusted main dispatch and exact confirmation
        id: authorize
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = "MIGRATE PRODUCTION $GITHUB_SHA"
          echo "approved_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Record authorized operation
        shell: bash
        run: |
          {
            echo "### Authorized production database migration"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Apply Prisma migrations
    needs: authorize
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.approved_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pnpm prisma:deploy
