name: Production Event Seed

on:
  workflow_dispatch:
    inputs:
      event_slug:
        description: "Event slug"
        required: true
        type: string
      package_price:
        description: "SEP20 package price"
        required: true
        type: string
      package_capacity:
        description: "SEP20 package capacity"
        required: true
        type: string
      confirmation:
        description: "Type SEED EVENT PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize current main event seed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      approved_sha: ${{ steps.authorize.outputs.approved_sha }}

    steps:
      - name: Verify trusted main dispatch and event inputs
        id: authorize
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SEED_EVENT_SLUG: ${{ inputs.event_slug }}
          SEED_PACKAGE_SEP20_PRICE: ${{ inputs.package_price }}
          SEED_PACKAGE_SEP20_CAPACITY: ${{ inputs.package_capacity }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = "SEED EVENT PRODUCTION"
          test "$SEED_EVENT_SLUG" = "kula-mytrack-2026"
          [[ "$SEED_PACKAGE_SEP20_PRICE" =~ ^[0-9]+([.][0-9]{1,2})?$ ]]
          [[ "$SEED_PACKAGE_SEP20_CAPACITY" =~ ^[1-9][0-9]*$ ]]
          echo "approved_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Record authorized operation
        shell: bash
        run: |
          {
            echo "### Authorized production event seed"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Event: ${{ inputs.event_slug }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  seed:
    name: Seed production event reference data
    needs: authorize
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.authorize.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit is current main
        shell: bash
        run: |
          git fetch --no-tags origin main
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          test "$CHECKED_OUT_SHA" = "$GITHUB_SHA"
          test "$CHECKED_OUT_SHA" = "$REMOTE_MAIN_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed production event reference data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_EVENT_SLUG: ${{ inputs.event_slug }}
          SEED_PACKAGE_SEP20_PRICE: ${{ inputs.package_price }}
          SEED_PACKAGE_SEP20_CAPACITY: ${{ inputs.package_capacity }}
        run: |
          test -n "$DATABASE_URL"
          pnpm seed:event
