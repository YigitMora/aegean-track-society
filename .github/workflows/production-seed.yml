name: Production Database Seed

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SEED PRODUCTION to run the production seed"
        required: true
        type: string
      seed_package_sep20_price:
        description: "SEP20 package price used by prisma db seed"
        required: true
        type: string
      seed_package_sep20_capacity:
        description: "SEP20 package capacity used by prisma db seed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  seed:
    name: Seed production reference data
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record production operation
        shell: bash
        run: |
          {
            echo "### Production database seed"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify typed confirmation and inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SEED_PACKAGE_SEP20_PRICE: ${{ inputs.seed_package_sep20_price }}
          SEED_PACKAGE_SEP20_CAPACITY: ${{ inputs.seed_package_sep20_capacity }}
        run: |
          test "$CONFIRMATION" = "SEED PRODUCTION"
          test -n "$SEED_PACKAGE_SEP20_PRICE"
          test -n "$SEED_PACKAGE_SEP20_CAPACITY"

      - name: Verify database secret
        run: test -n "$DATABASE_URL"

      - name: Seed production data
        env:
          SEED_PACKAGE_SEP20_PRICE: ${{ inputs.seed_package_sep20_price }}
          SEED_PACKAGE_SEP20_CAPACITY: ${{ inputs.seed_package_sep20_capacity }}
        run: pnpm prisma:seed
