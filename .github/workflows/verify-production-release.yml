name: Verify Production Release

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character Production commit SHA to verify after promotion"
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  authorize:
    name: Authorize exact main commit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.creator.type == 'Bot' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      github.event.deployment_status.creator.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_sha: ${{ steps.authorize.outputs.approved_sha }}
      verification_mode: ${{ steps.authorize.outputs.verification_mode }}
    env:
      VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'promoted' || 'staged' }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.deployment.sha }}

    steps:
      - name: Check out main policy source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: YigitMora/aegean-track-society
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit belongs to main
        id: authorize
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
          echo "approved_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "verification_mode=$VERIFICATION_MODE" >> "$GITHUB_OUTPUT"
          echo "Authorized repository=$GITHUB_REPOSITORY actor=$GITHUB_ACTOR sha=$EXPECTED_SHA run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  verify:
    name: Verify deployment provenance and API contract
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Check out approved commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: YigitMora/aegean-track-society
          ref: ${{ needs.authorize.outputs.approved_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify staged Vercel Production deployment
        if: ${{ needs.authorize.outputs.verification_mode == 'staged' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          EXPECTED_CANONICAL_PRODUCTION_SHA: ${{ vars.EXPECTED_CANONICAL_PRODUCTION_SHA }}
        run: >-
          pnpm verify:production-release
          --mode staged
          --repository "YigitMora/aegean-track-society"
          --sha "${{ needs.authorize.outputs.approved_sha }}"
          --expected-canonical-sha "$EXPECTED_CANONICAL_PRODUCTION_SHA"

      - name: Verify promoted Vercel Production deployment and API contract
        if: ${{ needs.authorize.outputs.verification_mode == 'promoted' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: >-
          pnpm verify:production-release
          --mode promoted
          --repository "YigitMora/aegean-track-society"
          --sha "${{ needs.authorize.outputs.approved_sha }}"
